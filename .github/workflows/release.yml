name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WeZZard/vm-service
          path: .ci/vm-service

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .ci/vm-service/rust

      - name: Build vmctl
        working-directory: .ci/vm-service/rust
        run: cargo build --release -p vmctl

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm for trusted publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify package.json agrees with the tag
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "package.json is at $pkg_version, but tag $GITHUB_REF_NAME implies $tag_version" >&2
            exit 1
          fi

      # Also typechecks and runs npm test, which includes the version-parity
      # test covering .claude-plugin/plugin.json and pi-mcp.json against
      # package.json. It does not run test:e2e, which drives a headless
      # browser inside a real VM.
      - name: Build, typecheck, and test
        run: npm run check
        env:
          VMCTL: ${{ github.workspace }}/.ci/vm-service/rust/target/release/vmctl

      - name: Confirm dist/ is up to date
        run: |
          set -e
          if ! git diff --exit-code -- dist; then
            echo "dist/ is stale: the build above produced changes that were not committed" >&2
            exit 1
          fi

      - name: Publish to npm
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          published_version=$(npm view "@wezzard/mcp-vm-relay@$tag_version" version 2>/dev/null || true)
          if [ "$published_version" = "$tag_version" ]; then
            echo "skip: @wezzard/mcp-vm-relay@$tag_version is already published"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "skip: release $GITHUB_REF_NAME already exists"
          else
            npm pack
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag ./wezzard-mcp-vm-relay-*.tgz
          fi

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # vmctl backs tests/environment-parity.test.ts; that test skips itself
      # with a reason when the binary is absent, so this is best-effort, not
      # a hard requirement.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WeZZard/vm-service
          path: .ci/vm-service

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .ci/vm-service/rust

      - name: Build vmctl
        working-directory: .ci/vm-service/rust
        run: cargo build --release -p vmctl

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run check builds, typechecks, and runs npm test. It does not run
      # test:e2e, which drives a headless browser inside a real VM.
      - name: Build, typecheck, and test
        run: npm run check
        env:
          VMCTL: ${{ github.workspace }}/.ci/vm-service/rust/target/release/vmctl
